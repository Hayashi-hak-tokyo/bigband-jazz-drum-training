<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jazz Drummer's Etude</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
</head>
<body class="bg-stone-100 text-stone-800 font-sans min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// --- Lucide Icons ---
const Play = ({ size = 24, className = "" }) => <i data-lucide="play" width={size} height={size} className={className}></i>;
const Square = ({ size = 24, className = "" }) => <i data-lucide="square" width={size} height={size} className={className}></i>;
const RefreshCw = ({ size = 24, className = "" }) => <i data-lucide="refresh-cw" width={size} height={size} className={className}></i>;

// --- Main App Component ---
function App() {
const [isLoaded, setIsLoaded] = useState(false);
const [bpm, setBpm] = useState(120);
const [mode, setMode] = useState("Hits");
const [numHitsMode, setNumHitsMode] = useState("Normal");
const [metronome, setMetronome] = useState(true);
const [loop, setLoop] = useState(true);
const [showSticking, setShowSticking] = useState(false); // 手順表示のデフォルトはオフ
const [backing, setBacking] = useState(true);
const [isPlaying, setIsPlaying] = useState(false);

const [baseSequence, setBaseSequence] = useState([]);
const [sequence, setSequence] = useState([]);

const [currentBeatDisplay, setCurrentBeatDisplay] = useState("1-1");

const containerRef = useRef(null);
const synthsRef = useRef(null);
const metronomeRef = useRef(metronome);
const backingRef = useRef(backing);

useEffect(() => {
metronomeRef.current = metronome;
}, [metronome]);

useEffect(() => {
backingRef.current = backing;
}, [backing]);

useEffect(() => {
if (window.lucide) {
window.lucide.createIcons();
}
});

useEffect(() => {
let checkInterval = setInterval(() => {
if (window.Tone && window.Vex) {
clearInterval(checkInterval);
setIsLoaded(true);
}
}, 100);
return () => clearInterval(checkInterval);
}, []);

// ベース生成
const generateBaseSequence = useCallback(() => {
let newSeq = new Array(32).fill("TIME");

let numHits;
let minDistance = 4; // デフォルトでは前後のHitと4マス(1拍分)空ける
if (numHitsMode === "Few") {
    numHits = 3;
} else if (numHitsMode === "Many") {
    numHits = 8;
    minDistance = 3; // 数が多い時は配置しやすくするため間隔制約を少し緩める
} else {
    numHits = Math.floor(Math.random() * 3) + 4; // Normal: 4〜6個
}

let hitPositions = [];
let overallAttempts = 0;

// 指定した数のHitが確実に配置されるように全体で再試行する
while (hitPositions.length < numHits && overallAttempts < 10) {
    hitPositions = [];
    overallAttempts++;
    for (let i = 0; i < numHits; i++) {
        let pos;
        let attempts = 0;
        do {
            pos = Math.floor(Math.random() * 30) + 2;
            attempts++;
        } while (
            attempts < 50 &&
            hitPositions.some(p => Math.abs(p - pos) < minDistance)
        );
        
        if (attempts < 50) {
            hitPositions.push(pos);
        } else {
            break; // 配置場所がなくなってしまったら、whileループで最初から配置し直す
        }
    }
}

// 万が一、配置場所が詰まってしまった場合の強制配置（フェイルセーフ）
while (hitPositions.length < numHits) {
    let pos = Math.floor(Math.random() * 30) + 2;
    if (!hitPositions.includes(pos)) {
        hitPositions.push(pos);
    }
}

hitPositions.forEach(pos => {
let isUpbeat = Math.random() < 0.5;
let isLong = Math.random() < 0.5;
// ロングのアクセントは原則右手(R)、ショートはランダム(R or L)とする
let hand = isLong ? "R" : (Math.random() < 0.5 ? "R" : "L"); 
newSeq[pos] = (isUpbeat ? (isLong ? "HIT_UP_LONG_" : "HIT_UP_SHORT_") : (isLong ? "HIT_DOWN_LONG_" : "HIT_DOWN_SHORT_")) + hand;
});

setBaseSequence(newSeq);
}, [numHitsMode]);

// フィルイン適用
useEffect(() => {
if (baseSequence.length === 0) return;

let newSeq = [...baseSequence];

for (let i = 0; i < 32; i++) {
let hitType = baseSequence[i];
if (hitType.startsWith("HIT_DOWN") || hitType.startsWith("HIT_UP")) {
let fillLen = 0;
if (mode === "Hits") fillLen = 0;
else if (mode === "Basic") fillLen = hitType.startsWith("HIT_DOWN") ? 2 : (Math.random() < 0.5 ? 1 : 2);
else fillLen = Math.floor(Math.random() * 2) + 3;

for (let j = 1; j <= fillLen; j++) {
let pos = i - j;
if (pos >= 0 && baseSequence[pos] === "TIME") {
if (j === 1 && hitType.startsWith("HIT_DOWN")) {
    let r = Math.random();
    if (r < 0.6) {
        newSeq[pos] = "SETUP_KICK_4";
    } else if (r < 0.9) {
        newSeq[pos] = Math.random() < 0.5 ? "SETUP_SK_88" : "SETUP_TK_88";
    } else {
        newSeq[pos] = Math.random() < 0.5 ? "SETUP_SSK_3" : "SETUP_TTK_3";
    }
} else {
    let fills = ["FILL_88_S", "FILL_88_T", "FILL_88_K", "FILL_3_S", "FILL_3_T"];

    // 8分ウラへのセットアップは左手(L)で入れて右のアクセントに繋ぐ
    if (j === 1 && hitType.startsWith("HIT_UP")) fills.push("SETUP_8R8_L");

    newSeq[pos] = fills[Math.floor(Math.random() * fills.length)];
}
}
}
}
}

// 3連符が4個続いた場合に12連符（ダブルストローク等の4拍フィル）に置き換え
for (let i = 0; i <= 32 - 4; i++) {
if (newSeq[i] && newSeq[i].startsWith("FILL_3_") && 
    newSeq[i+1] && newSeq[i+1].startsWith("FILL_3_") &&
    newSeq[i+2] && newSeq[i+2].startsWith("FILL_3_") &&
    newSeq[i+3] && newSeq[i+3].startsWith("FILL_3_")) {
    
    const variants12 = ["RRLLRRLLRRLL", "KKLLKKLLKKLL", "RRKKRRKKRRKK"];
    const v = variants12[Math.floor(Math.random() * variants12.length)];
    const isOrch = Math.random() < 0.5 ? "O" : "S";
    
    newSeq[i]   = `FILL_12_${v}_1_${isOrch}`;
    newSeq[i+1] = `FILL_12_${v}_2_${isOrch}`;
    newSeq[i+2] = `FILL_12_${v}_3_${isOrch}`;
    newSeq[i+3] = `FILL_12_${v}_4_${isOrch}`;
    i += 3; // 続く拍はスキップ
}
}

// 3連符が2個続いた場合に6連符（パラディドル等の2拍フィル）に置き換え
for (let i = 0; i <= 32 - 2; i++) {
if (newSeq[i] && newSeq[i].startsWith("FILL_3_") && newSeq[i+1] && newSeq[i+1].startsWith("FILL_3_")) {
    const variants6 = [
        "RLRLRL", "RLRLLR", "RLLRLL", "RLLRRL", "RLRRLL", "RLRRLK", // 既存
        "RRLRLL", "RRLLRL", "RLRRKK", "RLRLLK" // 追加: パラディドルディドルの展開形とキック
    ];
    const v = variants6[Math.floor(Math.random() * variants6.length)];
    const isOrch = Math.random() < 0.5 ? "O" : "S";
    newSeq[i]   = `FILL_6_${v}_1_${isOrch}`;
    newSeq[i+1] = `FILL_6_${v}_2_${isOrch}`;
    i++; // 次の拍はスキップ
}
}

// フィルインの最後の手順に合わせてアクセントの手順を調整（左手の必然性）
for (let i = 0; i < 32; i++) {
if (newSeq[i] && newSeq[i].startsWith("HIT_")) {
    let isLong = newSeq[i].includes("_LONG_");
    
    // 直前の拍（フィルイン）を確認
    let prevFill = i > 0 ? newSeq[i-1] : null;
    let needsLeftHand = false;
    
    if (prevFill) {
        // 単発の3連符、または6連符/12連符の最後が右(R)で終わっている場合は、次のアクセントは左(L)にする
        if (prevFill === "FILL_3_S" || prevFill === "FILL_3_T") {
            needsLeftHand = true; 
        } else if (prevFill.startsWith("FILL_6_") || prevFill.startsWith("FILL_12_")) {
            const parts = prevFill.split("_");
            const variant = parts[2];
            if (variant.slice(-1) === "R") {
                needsLeftHand = true;
            }
        }
    }
    
    // 必然性がある場合かつショートアクセントの場合のみ、左手(L)に上書きする
    if (needsLeftHand && !isLong) {
        newSeq[i] = newSeq[i].replace(/_[RL]$/, "_L");
    }
}
}

setSequence(newSeq);
}, [baseSequence, mode]);

useEffect(() => {
if (isLoaded) {
generateBaseSequence();
}
}, [isLoaded, generateBaseSequence]);

useEffect(() => {
if (window.Tone && isPlaying) {
Tone.Transport.bpm.value = bpm;
}
}, [bpm, isPlaying]);

useEffect(() => {
if (window.Tone) {
Tone.Transport.loop = loop;
}
}, [loop]);

// 描画エンジン
const drawScore = useCallback(() => {
if (!containerRef.current || !window.Vex || sequence.length === 0) return;

containerRef.current.innerHTML = "";
const VF = window.Vex.Flow;

const containerWidth = containerRef.current.clientWidth || 800;
const measuresPerRow = containerWidth < 600 ? 2 : 4;
const numRows = Math.ceil(8 / measuresPerRow);
const measureWidth = (containerWidth - 20) / measuresPerRow;

const renderer = new VF.Renderer(containerRef.current, VF.Renderer.Backends.SVG);
renderer.resize(containerWidth, 40 + numRows * 120);
const context = renderer.getContext();

let measures = [];
for(let m = 0; m < 8; m++){
measures.push(sequence.slice(m * 4, m * 4 + 4));
}

const colorGray = "#a8a29e";

const addSticking = (note, text) => {
    if (showSticking && text) {
        note.addModifier(new VF.Annotation(text)
            .setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM)
            .setFont("Arial", 12, "bold"), 0);
    }
    return note;
};

for (let i = 0; i < 8; i++) {
const row = Math.floor(i / measuresPerRow);
const col = i % measuresPerRow;
const x = 10 + col * measureWidth;
const y = 40 + row * 120;

const stave = new VF.Stave(x, y, measureWidth);
// 4/4 拍子を削除し、パーカッション記号のみを描画
if (col === 0) stave.addClef("percussion");
stave.setContext(context).draw();

let notes = [];
let beams = [];
let tuplets = [];

measures[i].forEach((pattern, beatIndex) => {
let beatNotes = [];

if (pattern === "TIME") {
const note = new VF.StaveNote({ keys: ["b/4"], duration: "4s", stem_direction: 1 });
note.setStyle({ fillStyle: colorGray, strokeStyle: colorGray });
beatNotes.push(note);
}
else if (pattern.startsWith("HIT_DOWN")) {
const note = new VF.StaveNote({ keys: ["g/5"], duration: "4", stem_direction: 1 });
const isLong = pattern.includes("LONG");
const hand = pattern.split("_").pop();
note.addModifier(new VF.Articulation(isLong ? "a^" : "a>").setPosition(3));
beatNotes.push(addSticking(note, hand));
}
else if (pattern.startsWith("HIT_UP")) {
const rest = new VF.StaveNote({ keys: ["b/4"], duration: "8r" });
const note = new VF.StaveNote({ keys: ["g/5"], duration: "8", stem_direction: 1 });
const isLong = pattern.includes("LONG");
const hand = pattern.split("_").pop();
note.addModifier(new VF.Articulation(isLong ? "a^" : "a>").setPosition(3));
beatNotes.push(rest, addSticking(note, hand));
}
else if (pattern.startsWith("SETUP_8R8")) {
const hand = pattern.split("_")[2] || "L";
beatNotes.push(
new VF.StaveNote({ keys: ["b/4"], duration: "8r" }),
addSticking(new VF.StaveNote({ keys: ["c/5"], duration: "8", stem_direction: 1 }), hand)
);
}
else if (pattern === "SETUP_KICK_4") {
beatNotes.push(new VF.StaveNote({ keys: ["f/4"], duration: "4", stem_direction: -1 }));
}
else if (pattern === "SETUP_SK_88") {
let n1 = addSticking(new VF.StaveNote({ keys: ["c/5"], duration: "8", stem_direction: 1 }), "L");
let n2 = new VF.StaveNote({ keys: ["f/4"], duration: "8", stem_direction: 1 });
beatNotes.push(n1, n2);
beams.push(new VF.Beam([n1, n2]));
}
else if (pattern === "SETUP_TK_88") {
let n1 = addSticking(new VF.StaveNote({ keys: ["a/4"], duration: "8", stem_direction: 1 }), "R");
let n2 = new VF.StaveNote({ keys: ["f/4"], duration: "8", stem_direction: 1 });
beatNotes.push(n1, n2);
beams.push(new VF.Beam([n1, n2]));
}
else if (pattern === "SETUP_SSK_3") {
let tNotes = [
addSticking(new VF.StaveNote({ keys: ["c/5"], duration: "8", stem_direction: 1 }), "R"),
addSticking(new VF.StaveNote({ keys: ["c/5"], duration: "8", stem_direction: 1 }), "L"),
new VF.StaveNote({ keys: ["f/4"], duration: "8", stem_direction: 1 })
];
beatNotes.push(...tNotes);
beams.push(new VF.Beam(tNotes));
tuplets.push(new VF.Tuplet(tNotes, { num_notes: 3, notes_occupied: 2 }));
}
else if (pattern === "SETUP_TTK_3") {
let tNotes = [
addSticking(new VF.StaveNote({ keys: ["a/4"], duration: "8", stem_direction: 1 }), "R"),
addSticking(new VF.StaveNote({ keys: ["e/5"], duration: "8", stem_direction: 1 }), "L"),
new VF.StaveNote({ keys: ["f/4"], duration: "8", stem_direction: 1 })
];
beatNotes.push(...tNotes);
beams.push(new VF.Beam(tNotes));
tuplets.push(new VF.Tuplet(tNotes, { num_notes: 3, notes_occupied: 2 }));
}
else if (pattern === "FILL_88_S") {
let n1 = addSticking(new VF.StaveNote({ keys: ["c/5"], duration: "8", stem_direction: 1 }), "R");
let n2 = addSticking(new VF.StaveNote({ keys: ["c/5"], duration: "8", stem_direction: 1 }), "L");
beatNotes.push(n1, n2);
beams.push(new VF.Beam([n1, n2]));
}
else if (pattern === "FILL_88_T") {
let n1 = addSticking(new VF.StaveNote({ keys: ["a/4"], duration: "8", stem_direction: 1 }), "R");
let n2 = addSticking(new VF.StaveNote({ keys: ["e/5"], duration: "8", stem_direction: 1 }), "L");
beatNotes.push(n1, n2);
beams.push(new VF.Beam([n1, n2]));
}
else if (pattern === "FILL_88_K") {
let n1 = new VF.StaveNote({ keys: ["f/4"], duration: "8", stem_direction: 1 });
let n2 = addSticking(new VF.StaveNote({ keys: ["c/5"], duration: "8", stem_direction: 1 }), "L");
beatNotes.push(n1, n2);
beams.push(new VF.Beam([n1, n2]));
}
else if (pattern === "FILL_3_S") {
let tNotes = [
addSticking(new VF.StaveNote({ keys: ["c/5"], duration: "8", stem_direction: 1 }), "R"),
addSticking(new VF.StaveNote({ keys: ["c/5"], duration: "8", stem_direction: 1 }), "L"),
addSticking(new VF.StaveNote({ keys: ["c/5"], duration: "8", stem_direction: 1 }), "R")
];
beatNotes.push(...tNotes);
beams.push(new VF.Beam(tNotes));
tuplets.push(new VF.Tuplet(tNotes, { num_notes: 3, notes_occupied: 2 }));
}
else if (pattern === "FILL_3_T") {
let tNotes = [
addSticking(new VF.StaveNote({ keys: ["e/5"], duration: "8", stem_direction: 1 }), "R"),
addSticking(new VF.StaveNote({ keys: ["c/5"], duration: "8", stem_direction: 1 }), "L"),
addSticking(new VF.StaveNote({ keys: ["a/4"], duration: "8", stem_direction: 1 }), "R")
];
beatNotes.push(...tNotes);
beams.push(new VF.Beam(tNotes));
tuplets.push(new VF.Tuplet(tNotes, { num_notes: 3, notes_occupied: 2 }));
}
else if (pattern.startsWith("FILL_6_") || pattern.startsWith("FILL_12_")) {
const parts = pattern.split("_");
const variant = parts[2];
const partNum = parseInt(parts[3], 10);
const type = parts[4];

let notesArr = [];
if (type === "S") {
    // S指定時はすべてスネアだが、手順文字列にKが含まれる場合はキックとする
    notesArr = variant.split("").map(char => char === "K" ? "K" : "S");
} else {
    // オーケストレーション(タム回し)の割り当て定義
    const orchMap = {
        "RLRLRL": ["T1", "S", "T2", "S", "T1", "S"],
        "RLRLLR": ["S", "T1", "T2", "S", "S", "T1"],
        "RLLRLL": ["T1", "S", "S", "T2", "S", "S"],
        "RLLRRL": ["T1", "S", "S", "S", "S", "T1"],
        "RLRRLL": ["S", "T1", "S", "S", "S", "S"],
        "RLRRLK": ["T1", "S", "S", "S", "S", "K"],
        // 追加: パラディドルディドルの展開
        "RRLRLL": ["T1", "T1", "S", "T2", "S", "S"],
        "RRLLRL": ["T1", "T1", "S", "S", "T2", "S"],
        "RLRRKK": ["T1", "S", "T2", "T2", "K", "K"],
        "RLRLLK": ["T1", "S", "T2", "S", "S", "K"],
        // 追加: ダブルストローク (4拍/12音)
        "RRLLRRLLRRLL": ["T1", "T1", "S", "S", "T2", "T2", "S", "S", "T1", "T1", "S", "S"],
        "KKLLKKLLKKLL": ["K", "K", "S", "S", "K", "K", "S", "S", "K", "K", "S", "S"],
        "RRKKRRKKRRKK": ["T1", "T1", "K", "K", "T2", "T2", "K", "K", "T1", "T1", "K", "K"]
    };
    notesArr = orchMap[variant] || variant.split("").map(char => char === "K" ? "K" : "S");
}

// 該当する拍（3音分）を抽出
const startIndex = (partNum - 1) * 3;
const currentNotes = notesArr.slice(startIndex, startIndex + 3);
const currentSticking = variant.split("").slice(startIndex, startIndex + 3);

const keyMap = { "S": "c/5", "T1": "e/5", "T2": "a/4", "K": "f/4" };

let tNotes = currentNotes.map((n, idx) => {
    let sn = new VF.StaveNote({ keys: [keyMap[n]], duration: "8", stem_direction: 1 });
    return addSticking(sn, currentSticking[idx]);
});

beatNotes.push(...tNotes);
beams.push(new VF.Beam(tNotes));
tuplets.push(new VF.Tuplet(tNotes, { num_notes: 3, notes_occupied: 2 }));
}
else if (pattern === "REST_4") {
beatNotes.push(new VF.StaveNote({ keys: ["b/4"], duration: "4r" }));
}

notes.push(...beatNotes);
});

if (notes.length === 0) {
notes.push(new VF.StaveNote({ keys: ["b/4"], duration: "1r" }));
}

const voice = new VF.Voice({ num_beats: 4, beat_value: 4 });
voice.addTickables(notes);

new VF.Formatter().joinVoices([voice]).formatToStave([voice], stave);
voice.draw(context, stave);

beams.forEach(b => b.setContext(context).draw());
tuplets.forEach(t => t.setContext(context).draw());
}

}, [sequence, showSticking]);

useEffect(() => {
let timerId = setTimeout(() => drawScore(), 100);
const handleResize = () => requestAnimationFrame(drawScore);
window.addEventListener("resize", handleResize);
let observer;
if (containerRef.current && containerRef.current.parentElement) {
observer = new ResizeObserver(() => requestAnimationFrame(drawScore));
observer.observe(containerRef.current.parentElement);
}
return () => {
clearTimeout(timerId);
window.removeEventListener("resize", handleResize);
if (observer) observer.disconnect();
};
}, [drawScore]);

// 音源初期化
const initSynths = () => {
// 全体の音割れ（クリッピング）を防ぐためのリミッターを追加
const limiter = new Tone.Limiter(-2).toDestination();

const rhodes = new Tone.PolySynth(Tone.Synth, {
oscillator: { type: "triangle" }, // sineよりも少し輪郭のある音色
envelope: { attack: 0.02, decay: 0.5, sustain: 0.6, release: 2 },
volume: -12
}).connect(limiter);

const kick = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 4, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 1.4 }, volume: 0 }).connect(limiter);
const snare = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0 }, volume: -8 }).connect(limiter);
const snareTone = new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 2, oscillator: { type: "triangle" }, envelope: { attack: 0.001, decay: 0.1, sustain: 0 }, volume: -8 }).connect(limiter);

const tomHi = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 4, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 1.4 }, volume: -4 }).connect(limiter);
const tomLo = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 4, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.5, sustain: 0.01, release: 1.4 }, volume: -4 }).connect(limiter);

const hihat = new Tone.MetalSynth({ frequency: 200, envelope: { attack: 0.001, decay: 0.1, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5, volume: -16 }).connect(limiter);
const ride = new Tone.MetalSynth({ frequency: 300, envelope: { attack: 0.001, decay: 0.5, release: 0.1 }, harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5, volume: -16 }).connect(limiter);
const crash = new Tone.MetalSynth({ frequency: 200, envelope: { attack: 0.001, decay: 1.5, release: 0.1 }, harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5, volume: -10 }).connect(limiter);

const click = new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 1, oscillator: { type: "square" }, envelope: { attack: 0.001, decay: 0.1, sustain: 0 }, volume: -10 }).connect(limiter);

synthsRef.current = { rhodes, kick, snare, snareTone, tomHi, tomLo, hihat, ride, crash, click };
};

const togglePlay = async () => {
if (isPlaying) {
Tone.Transport.stop();
Tone.Transport.cancel();
setIsPlaying(false);
setCurrentBeatDisplay("1-1");
return;
}

await Tone.start();
if (!synthsRef.current) initSynths();

Tone.Transport.cancel();
Tone.Transport.bpm.value = bpm;
Tone.Transport.loop = loop;
Tone.Transport.loopStart = 0;

const { rhodes, kick, snare, snareTone, tomHi, tomLo, hihat, ride, crash, click } = synthsRef.current;

let timeAcc = 0;
const beatSec = 60 / bpm;
const swingDelay = beatSec * (2/3);
const tripletDelay = beatSec / 3;

// コード進行（E♭maj7 - Cm7 - Fm7 - B♭7）とボイシングの定義
const CHORD_PROGRESSION = [
{ root: "Eb3", notes: ["G3", "Bb3", "D4", "F4"] }, // I: E♭maj7 (EbM9)
{ root: "C3",  notes: ["Eb3", "G3", "Bb3", "D4"] }, // VI7: Cm7 (Cm9)
{ root: "F2",  notes: ["Ab3", "C4", "Eb4", "G4"] }, // IIm7: Fm7 (Fm9)
{ root: "Bb2", notes: ["Ab3", "C4", "D4", "F4"] }  // V7: B♭7 (Bb9)
];

const playHit = (time, isLong, chord) => {
// ルート音 + 和音をそれぞれ1オクターブ上げる
const notesToPlay = [chord.root, ...chord.notes].map(n => n.replace(/\d/, d => parseInt(d) + 1)); 
if (isLong) {
crash.triggerAttackRelease("8n", time);
kick.triggerAttackRelease("C1", "8n", time);
rhodes.triggerAttackRelease(notesToPlay, "8n", time, 1.0); // Hitは強め(ベロシティ1.0)
} else {
snare.triggerAttackRelease("16n", time, 1.2);
snareTone.triggerAttackRelease("G3", "16n", time, 1.2);
hihat.triggerAttackRelease("16n", time, 1.0);
rhodes.triggerAttackRelease(notesToPlay, "16n", time, 1.0);
}
};

sequence.forEach((pattern, index) => {
const beatTime = timeAcc;
const beatInMeasure = index % 4;
const currentMeasureIndex = Math.floor(index / 4);
const currentMeasure = currentMeasureIndex + 1;
const currentChord = CHORD_PROGRESSION[currentMeasureIndex % 4];

// 小節の頭(1拍目)でRhodesの全音符バッキングを鳴らす
if (beatInMeasure === 0) {
Tone.Transport.schedule((time) => {
if (backingRef.current) {
const compNotes = [currentChord.root, ...currentChord.notes];
rhodes.triggerAttackRelease(compNotes, "1m", time, 0.6); // バッキングは少し弱め(ベロシティ0.6)
}
}, beatTime);
}

Tone.Transport.schedule((time) => {
Tone.Draw.schedule(() => {
setCurrentBeatDisplay(`${currentMeasure}-${beatInMeasure + 1}`);
}, time);
}, beatTime);

Tone.Transport.schedule((time) => {
if (metronomeRef.current) {
click.triggerAttackRelease("C4", "32n", time, 0.5);
}
}, beatTime);

if (pattern === "TIME") {
// 何もしない
}
else if (pattern.startsWith("HIT_DOWN")) {
Tone.Transport.schedule((time) => playHit(time, pattern.includes("LONG"), currentChord), beatTime);
}
else if (pattern.startsWith("HIT_UP")) {
let upTime = beatTime + swingDelay;
Tone.Transport.schedule((time) => playHit(time, pattern.includes("LONG"), currentChord), upTime);
}
else if (pattern.startsWith("SETUP_8R8")) {
Tone.Transport.schedule((time) => {
snare.triggerAttackRelease("16n", time, 0.7); snareTone.triggerAttackRelease("G3", "16n", time, 0.7);
}, beatTime + swingDelay);
}
else if (pattern === "SETUP_KICK_4") {
Tone.Transport.schedule((time) => { kick.triggerAttackRelease("C1", "16n", time); }, beatTime);
}
else if (pattern === "SETUP_SK_88") {
Tone.Transport.schedule((time) => { snare.triggerAttackRelease("16n", time); snareTone.triggerAttackRelease("G3", "16n", time); }, beatTime);
Tone.Transport.schedule((time) => { kick.triggerAttackRelease("C1", "16n", time); }, beatTime + swingDelay);
}
else if (pattern === "SETUP_TK_88") {
Tone.Transport.schedule((time) => { tomLo.triggerAttackRelease("G2", "16n", time); }, beatTime);
Tone.Transport.schedule((time) => { kick.triggerAttackRelease("C1", "16n", time); }, beatTime + swingDelay);
}
else if (pattern === "SETUP_SSK_3") {
Tone.Transport.schedule((time) => { snare.triggerAttackRelease("16n", time); snareTone.triggerAttackRelease("G3", "16n", time); }, beatTime);
Tone.Transport.schedule((time) => { snare.triggerAttackRelease("16n", time); snareTone.triggerAttackRelease("G3", "16n", time); }, beatTime + tripletDelay);
Tone.Transport.schedule((time) => { kick.triggerAttackRelease("C1", "16n", time); }, beatTime + 2 * tripletDelay);
}
else if (pattern === "SETUP_TTK_3") {
Tone.Transport.schedule((time) => { tomLo.triggerAttackRelease("A2", "16n", time); }, beatTime);
Tone.Transport.schedule((time) => { tomHi.triggerAttackRelease("E3", "16n", time); }, beatTime + tripletDelay);
Tone.Transport.schedule((time) => { kick.triggerAttackRelease("C1", "16n", time); }, beatTime + 2 * tripletDelay);
}
else if (pattern === "FILL_88_S") {
Tone.Transport.schedule((time) => { snare.triggerAttackRelease("16n", time); snareTone.triggerAttackRelease("G3", "16n", time); }, beatTime);
Tone.Transport.schedule((time) => { snare.triggerAttackRelease("16n", time); snareTone.triggerAttackRelease("G3", "16n", time); }, beatTime + swingDelay);
}
else if (pattern === "FILL_88_T") {
Tone.Transport.schedule((time) => { tomLo.triggerAttackRelease("A2", "16n", time); }, beatTime);
Tone.Transport.schedule((time) => { tomHi.triggerAttackRelease("E3", "16n", time); }, beatTime + swingDelay);
}
else if (pattern === "FILL_88_K") {
Tone.Transport.schedule((time) => { kick.triggerAttackRelease("C1", "16n", time); }, beatTime);
Tone.Transport.schedule((time) => { snare.triggerAttackRelease("16n", time); snareTone.triggerAttackRelease("G3", "16n", time); }, beatTime + swingDelay);
}
else if (pattern === "FILL_3_S") {
Tone.Transport.schedule((time) => { snare.triggerAttackRelease("16n", time); snareTone.triggerAttackRelease("G3", "16n", time); }, beatTime);
Tone.Transport.schedule((time) => { snare.triggerAttackRelease("16n", time); snareTone.triggerAttackRelease("G3", "16n", time); }, beatTime + tripletDelay);
Tone.Transport.schedule((time) => { snare.triggerAttackRelease("16n", time); snareTone.triggerAttackRelease("G3", "16n", time); }, beatTime + 2 * tripletDelay);
}
else if (pattern === "FILL_3_T") {
Tone.Transport.schedule((time) => { tomHi.triggerAttackRelease("E3", "16n", time); }, beatTime);
Tone.Transport.schedule((time) => { snare.triggerAttackRelease("16n", time); snareTone.triggerAttackRelease("G3", "16n", time); }, beatTime + tripletDelay);
Tone.Transport.schedule((time) => { tomLo.triggerAttackRelease("A2", "16n", time); }, beatTime + 2 * tripletDelay);
}
else if (pattern.startsWith("FILL_6_") || pattern.startsWith("FILL_12_")) {
const parts = pattern.split("_");
const variant = parts[2];
const partNum = parseInt(parts[3], 10);
const type = parts[4];

let notesArr = [];
if (type === "S") {
    notesArr = variant.split("").map(char => char === "K" ? "K" : "S");
} else {
    const orchMap = {
        "RLRLRL": ["T1", "S", "T2", "S", "T1", "S"],
        "RLRLLR": ["S", "T1", "T2", "S", "S", "T1"],
        "RLLRLL": ["T1", "S", "S", "T2", "S", "S"],
        "RLLRRL": ["T1", "S", "S", "S", "S", "T1"],
        "RLRRLL": ["S", "T1", "S", "S", "S", "S"],
        "RLRRLK": ["T1", "S", "S", "S", "S", "K"],
        "RRLRLL": ["T1", "T1", "S", "T2", "S", "S"],
        "RRLLRL": ["T1", "T1", "S", "S", "T2", "S"],
        "RLRRKK": ["T1", "S", "T2", "T2", "K", "K"],
        "RLRLLK": ["T1", "S", "T2", "S", "S", "K"],
        "RRLLRRLLRRLL": ["T1", "T1", "S", "S", "T2", "T2", "S", "S", "T1", "T1", "S", "S"],
        "KKLLKKLLKKLL": ["K", "K", "S", "S", "K", "K", "S", "S", "K", "K", "S", "S"],
        "RRKKRRKKRRKK": ["T1", "T1", "K", "K", "T2", "T2", "K", "K", "T1", "T1", "K", "K"]
    };
    notesArr = orchMap[variant] || variant.split("").map(char => char === "K" ? "K" : "S");
}

const startIndex = (partNum - 1) * 3;
const currentNotes = notesArr.slice(startIndex, startIndex + 3);

currentNotes.forEach((n, idx) => {
    Tone.Transport.schedule((time) => {
        if (n === "S") { snare.triggerAttackRelease("16n", time); snareTone.triggerAttackRelease("G3", "16n", time); }
        else if (n === "T1") { tomHi.triggerAttackRelease("E3", "16n", time); }
        else if (n === "T2") { tomLo.triggerAttackRelease("A2", "16n", time); }
        else if (n === "K") { kick.triggerAttackRelease("C1", "16n", time); }
    }, beatTime + idx * tripletDelay);
});
}

timeAcc += beatSec;
});

Tone.Transport.loopEnd = timeAcc;

Tone.Transport.schedule((time) => {
if (!Tone.Transport.loop) {
Tone.Draw.schedule(() => {
Tone.Transport.stop();
setIsPlaying(false);
setCurrentBeatDisplay("1-1");
}, time);
}
}, timeAcc);

setIsPlaying(true);
Tone.Transport.start();
};

if (!isLoaded) {
return <div className="flex items-center justify-center h-screen"><p className="text-xl font-bold animate-pulse">Loading engine...</p></div>;
}

return (
<div className="max-w-5xl mx-auto p-4 md:p-8">
<header className="mb-8 flex justify-between items-end">
<div>
<h1 className="text-3xl font-bold text-stone-800 tracking-tight">Jazz Drummer's Etude</h1>
<p className="text-stone-500 mt-1">アンサンブルのキメ（Hits）に対するフィルインの練習用アプリケーション</p>
</div>
</header>

<div className="bg-white rounded-2xl shadow-sm border border-stone-200 p-6 mb-6">
<div className="flex flex-col gap-6">
<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-6 items-end">

{/* BPM Control */}
<div>
<label className="block text-sm font-medium text-stone-600 mb-2">BPM: {bpm}</label>
<input
type="range"
min="60" max="320" step="5"
value={bpm}
onChange={(e) => setBpm(parseInt(e.target.value))}
className="w-full h-2 bg-stone-200 rounded-lg appearance-none cursor-pointer accent-stone-700"
/>
</div>

{/* Mode Selection */}
<div className="lg:col-span-2">
<label className="block text-sm font-medium text-stone-600 mb-2">ドラムフィルモード</label>
<div className="flex bg-stone-100 rounded-lg p-1">
{["Hits", "Basic", "Advanced"].map(m => (
<button
key={m}
onClick={() => { setMode(m); setIsPlaying(false); setCurrentBeatDisplay("1-1"); }}
className={`flex-1 py-1 px-3 rounded-md text-sm font-medium transition-colors ${mode === m ? 'bg-white shadow text-stone-800' : 'text-stone-500 hover:text-stone-700'}`}
>
{m}
</button>
))}
</div>
</div>

{/* Number of Hits Selection */}
<div className="lg:col-span-2">
<label className="block text-sm font-medium text-stone-600 mb-2">Number of Hits</label>
<div className="flex bg-stone-100 rounded-lg p-1">
{["Few", "Normal", "Many"].map(m => (
<button
key={m}
onClick={() => { setNumHitsMode(m); setIsPlaying(false); setCurrentBeatDisplay("1-1"); }}
className={`flex-1 py-1 px-3 rounded-md text-sm font-medium transition-colors ${numHitsMode === m ? 'bg-white shadow text-stone-800' : 'text-stone-500 hover:text-stone-700'}`}
>
{m}
</button>
))}
</div>
</div>

</div>

<div className="flex flex-col md:flex-row justify-between items-end gap-6 border-t border-stone-100 pt-6">

{/* Toggles */}
<div className="flex flex-wrap gap-4 md:gap-6 py-1">
<label className="flex items-center cursor-pointer">
<input
type="checkbox"
checked={metronome}
onChange={() => setMetronome(!metronome)}
className="sr-only peer"
/>
<div className="w-11 h-6 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-stone-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-stone-700 relative"></div>
<span className="ml-3 text-sm font-medium text-stone-600">メトロノーム</span>
</label>
<label className="flex items-center cursor-pointer">
<input
type="checkbox"
checked={loop}
onChange={() => setLoop(!loop)}
className="sr-only peer"
/>
<div className="w-11 h-6 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-stone-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-stone-700 relative"></div>
<span className="ml-3 text-sm font-medium text-stone-600">ループ再生</span>
</label>
<label className="flex items-center cursor-pointer">
<input
type="checkbox"
checked={showSticking}
onChange={() => setShowSticking(!showSticking)}
className="sr-only peer"
/>
<div className="w-11 h-6 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-stone-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-stone-700 relative"></div>
<span className="ml-3 text-sm font-medium text-stone-600">手順の表示</span>
</label>
<label className="flex items-center cursor-pointer">
<input
type="checkbox"
checked={backing}
onChange={() => setBacking(!backing)}
className="sr-only peer"
/>
<div className="w-11 h-6 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-stone-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-stone-700 relative"></div>
<span className="ml-3 text-sm font-medium text-stone-600">Backing</span>
</label>
</div>

{/* Action Buttons */}
<div className="flex space-x-3 w-full md:w-auto">
<button
onClick={togglePlay}
className={`flex-1 md:flex-none flex items-center justify-center space-x-2 py-2 px-6 rounded-lg font-bold transition-colors ${isPlaying ? 'bg-red-50 text-red-600 hover:bg-red-100' : 'bg-stone-800 text-white hover:bg-stone-700'}`}
>
{isPlaying ? <><Square size={18} /><span>停止</span></> : <><Play size={18} /><span>再生</span></>}
</button>
<button
onClick={() => { Tone.Transport.stop(); setIsPlaying(false); setCurrentBeatDisplay("1-1"); generateBaseSequence(); }}
className="flex-1 md:flex-none flex items-center justify-center space-x-2 py-2 px-6 bg-stone-100 text-stone-600 hover:bg-stone-200 rounded-lg font-bold transition-colors border border-stone-200"
title="新しく生成"
>
<RefreshCw size={18} />
<span>New</span>
</button>
</div>

</div>
</div>
</div>

{/* Score Area */}
<div className="bg-white rounded-2xl shadow-sm border border-stone-200 p-4 md:p-6 overflow-hidden relative">
<div className="absolute top-4 right-6 bg-stone-800 text-white font-mono text-2xl font-bold px-4 py-2 rounded-lg shadow-md z-10 opacity-90 border-2 border-stone-600 tracking-widest">
{currentBeatDisplay}
</div>
<div ref={containerRef} className="w-full mt-4"></div>
</div>

<footer className="mt-8 text-sm text-stone-500">
<div className="flex flex-wrap gap-4 justify-center items-center mb-4 text-xs">
<span className="flex items-center gap-1"><span className="font-bold text-lg">^</span> Long Hit (Crash & Kick)</span>
<span className="flex items-center gap-1"><span className="font-bold text-lg">&gt;</span> Short Hit (Snare Rim-shot & Hi-Hat)</span>
</div>
<p className="text-center">「Hits」はキメのみ、「Basic」は1〜2拍フィル、「Advanced」は3〜4拍フィルの練習モードです。<br/>※スイングフィールで再生されます。
<br/>※Backingのコード進行はE♭△7|Cm7|Fm7|B♭7 (Key=E♭) </p>
</footer>
</div>
);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="hayashi_jp" data-description="Support me on Buy me a coffee!" data-message="開発へのサポートはこちらから！コーヒー1杯の応援が毎日の励みになります☕️✨" data-color="#40DCA5" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
</body>
</html>
